[project]
name = "rtmpose-tracker"
version = "0.1.0"
description = "Multi-person pose detection with RTMPose-m and lightweight Kalman+Hungarian tracker"
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.24.0,<2.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "opencv-python>=4.8.0",
    "openmim",
    "mmengine",
    "mmdet>=3.1.0",
    "mmpose>=1.3.0",
    "scipy>=1.10.0",
    "filterpy>=1.4.5",
]

# Note: mmcv must be installed separately via install.sh to get prebuilt CUDA wheels

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[tool.uv.extra-build-dependencies]
chumpy = ["pip", "setuptools"]

[dependency-groups]
dev = ["pytest"]
