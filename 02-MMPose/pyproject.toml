[project]
name = "mmpose-webcam-pose"
version = "0.1.0"
description = "Webcam pose detection using MMPose"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24.0,<2.0",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "opencv-python",
    "openmim",
    "mmengine",
    "mmdet>=3.1.0",
    "mmpose>=1.3.0",
]

# Note: mmcv must be installed separately via install.sh to get prebuilt CUDA wheels
# Run: ./install.sh

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[tool.uv.extra-build-dependencies]
chumpy = ["pip", "setuptools"]

[dependency-groups]
dev = ["pytest"]