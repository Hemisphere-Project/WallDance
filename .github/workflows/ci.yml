name: CI

# Run the unit tests on every push to main and on every pull request.
# The suite is import-light (cv2 + numpy only — no torch/IDS/dearpygui), so CI
# installs a minimal dependency set rather than the full CUDA/IDS stack.
# dulwich (pure-python) covers the launcher git-update safety tests.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]  # bookends of pyproject's >=3.10,<3.13
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless pytest dulwich

      - name: Run tests
        run: python -m pytest application/tests -q
