[project]
name = "yolo11-pose"
version = "0.1.0"
description = "Multi-person pose detection using YOLO11-pose, optimized for low-light"
requires-python = ">=3.10,<3.13"

dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = ["pytest"]
