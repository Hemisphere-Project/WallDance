[project]
name = "walldance-1080p"
version = "0.1.0"
description = "Multi-person pose detection optimized for wall dancers in low-light conditions"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10,<3.13"

dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "scipy>=1.10.0",
    "filterpy>=1.4.5",
    "python-osc>=1.8.0",
    "dearpygui>=2.0.0",
]

[project.optional-dependencies]
# GPU-only packages (require NVIDIA GPU + CUDA drivers)
gpu = [
    "nvidia-ml-py>=13.580.82",
    "tensorrt>=10.0.0",
    "kornia>=0.8.2",
    "onnx>=1.12.0,<2.0.0",
    "onnxslim>=0.1.71",
    "onnxruntime-gpu",
]
# IDS industrial camera SDK (requires IDS Peak installed on system)
ids = [
    "ids-peak>=1.13.0.0.6",
    "ids-peak-ipl>=1.17.1.0.5",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch" }
torchvision = { index = "pytorch" }

[dependency-groups]
dev = ["pytest"]
