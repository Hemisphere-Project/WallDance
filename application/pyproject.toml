[project]
name = "walldance-1080p"
version = "0.1.0"
description = "Multi-person pose detection optimized for wall dancers in low-light conditions"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10,<3.13"

dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0,<2.0",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "scipy>=1.10.0",
    "filterpy>=1.4.5",
    "python-osc>=1.8.0",
    "dearpygui>=2.0.0",
    "nvidia-ml-py>=13.580.82",
    "tensorrt>=10.0.0",
    "kornia>=0.8.2",
    "ids-peak>=1.13.0.0.6",
    "ids-peak-ipl>=1.17.1.0.5",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
index-strategy = "unsafe-best-match"

[dependency-groups]
dev = ["pytest"]
ids = [
    "ids-peak",
    "ids-peak-ipl",
]
